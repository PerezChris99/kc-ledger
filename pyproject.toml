[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kc-ledger"
version = "0.1.0"
description = "Private financial operations console"
requires-python = ">=3.11"
dependencies = ["Django>=5.2,<5.3", "django-ninja>=1.3,<2", "APScheduler>=3.10,<4", "pandas>=2.2,<3", "WeasyPrint>=62,<70", "gunicorn>=22,<24", "whitenoise>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-django>=4.8,<5", "ruff>=0.6,<1"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["backend"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
