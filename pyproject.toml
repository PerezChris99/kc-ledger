[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kc-ledger"
dynamic = ["version"]
description = "Private financial operations console"
requires-python = ">=3.11"
dependencies = ["Django>=5.2,<5.3", "django-ninja>=1.8,<2", "APScheduler>=3.10,<4", "reportlab>=4.3,<5", "gunicorn>=22,<24", "whitenoise>=6.7,<7", "python-dotenv>=1,<2", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
desktop = ["waitress>=3,<4", "pywebview>=5,<7", "pyinstaller>=6,<7"]
dev = ["pytest>=9.0.3,<10", "pytest-django>=4.8,<5", "ruff>=0.6,<1"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["backend"]
pythonpath = [".", "backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Django migration and model Meta classes intentionally use framework-required mutable lists.
"backend/ledger/models.py" = ["RUF012"]
"backend/ledger/migrations/*.py" = ["RUF012"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
