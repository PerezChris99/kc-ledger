services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${LEDGER_DB_NAME:-kc_ledger}
      POSTGRES_USER: ${LEDGER_DB_USER:-kc_ledger}
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:?Set LEDGER_DB_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ledger_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEDGER_DB_USER:-kc_ledger} -d ${LEDGER_DB_NAME:-kc_ledger}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        LEDGER_GIT_SHA: ${GITHUB_SHA:-unknown}
    env_file: .env
    environment:
      LEDGER_DB_ENGINE: postgres
      LEDGER_DB_HOST: db
      LEDGER_DB_PORT: "5432"
      LEDGER_DB_NAME: ${LEDGER_DB_NAME:-kc_ledger}
      LEDGER_DB_USER: ${LEDGER_DB_USER:-kc_ledger}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?Set LEDGER_DB_PASSWORD in .env}
      LEDGER_BACKUP_DIR: /app/data/backups
      LEDGER_DB_PATH: /app/data/ledger.sqlite3
      RUN_SCHEDULER: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ledger_data:/app/data
    expose: ["8000"]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        LEDGER_GIT_SHA: ${GITHUB_SHA:-unknown}
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
volumes:
  ledger_pgdata:
  ledger_data:
