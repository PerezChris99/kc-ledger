server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /health { access_log off; add_header Content-Type text/plain; return 200 "ok"; }
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location /admin/ { proxy_pass http://api:8000/admin/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2)$ { expires 7d; add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
}
