name: Autoformat Python source
on:
  push:
    branches: [perez]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perez
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.17.5'
      - name: Fix source formatting and safe lint auto-fixes
        run: |
          ruff check backend --fix --exit-zero
          ruff format backend
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if ! git diff --cached --quiet; then
            git commit -m "style(python): normalize Ruff imports and formatting"
            git pull --rebase origin perez
            git push origin HEAD:perez
          fi
