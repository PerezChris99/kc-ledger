name: Generate reproducible dependency locks
on:
  push:
    branches: [perez]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perez
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate npm lockfile
        run: |
          if ! npm install --package-lock-only --ignore-scripts --no-audit; then
            echo "Stale npm lockfile; rebuilding against package manifest"
            rm -f package-lock.json
            npm install --package-lock-only --ignore-scripts --no-audit
          fi
      - name: Generate Python Linux lockfiles
        run: |
          python -m pip install pip-tools
          pip-compile --extra dev --generate-hashes --output-file=requirements-linux.lock pyproject.toml
          pip-compile --generate-hashes --output-file=requirements-prod.lock pyproject.toml
      - name: Commit lockfiles to perez
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json requirements-linux.lock requirements-prod.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): regenerate reproducible npm and Python Linux locks"
            # Autoformat may have advanced perez while locks were building.
            # Rebase the lock-only commit onto the latest head and retry safely.
            for attempt in 1 2 3; do
              git fetch origin perez
              git rebase origin/perez
              if git push origin HEAD:perez; then
                exit 0
              fi
              sleep 2
            done
            echo "Unable to publish dependency locks after three attempts" >&2
            exit 1
          fi
