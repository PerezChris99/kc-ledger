name: One-time coordinated TypeScript to JavaScript conversion
on:
  push:
    branches: [perez]
    paths:
      - scripts/migrate-typescript-to-jsx.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    concurrency:
      group: kc-ledger-jsx-migration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perez
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing pinned TypeScript compiler for syntax-aware conversion
        run: npm ci
      - name: Convert TypeScript, TSX, tooling and tests in one change
        run: node scripts/migrate-typescript-to-jsx.mjs
      - name: Regenerate dependency lock after removing TypeScript and its lint parser
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci
      - name: Validate converted application before committing
        run: |
          npm run lint
          npm run build
          test -f dist/index.html
          if find frontend e2e -type f \( -name '*.ts' -o -name '*.tsx' \) | grep -q .; then
            echo 'Unconverted TypeScript source remains'
            exit 1
          fi
          test ! -f vite.config.ts
          test ! -f playwright.config.ts
          test ! -f tsconfig.json
      - name: Commit completed migration on perez
        run: |
          git config user.name "PerezChris99"
          git config user.email "kweeziperez712@gmail.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor(frontend)!: migrate entire React and tooling codebase from TypeScript to JavaScript JSX"
          git pull --rebase origin perez
          git push origin HEAD:perez
