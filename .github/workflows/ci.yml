name: KC Ledger source and package verification
on:
  push:
    branches: [perez, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: CI-only-nonproduction-secret-key-change-on-every-deployment-123456789
      DJANGO_DEBUG: '1'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      LEDGER_DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit
      - name: Database and configuration
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py migrate --noinput
      - name: Django and pytest suites
        run: |
          DJANGO_SETTINGS_MODULE=config.test_settings python backend/manage.py test
          pytest -q
      - name: Ruff lint and formatting
        run: |
          ruff check backend
          ruff format --check backend
      - name: Dependency security review
        run: pip-audit -r requirements-linux.lock --disable-pip --no-deps --require-hashes
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ledger_ci
          POSTGRES_USER: ledger_ci
          POSTGRES_PASSWORD: CI-only-db-password-123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger_ci -d ledger_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DJANGO_SECRET_KEY: CI-only-PostgreSQL-test-key-123456789012345678901234567890
      DJANGO_DEBUG: '1'
      DJANGO_SETTINGS_MODULE: config.test_settings
      LEDGER_DB_ENGINE: postgres
      LEDGER_DB_HOST: 127.0.0.1
      LEDGER_DB_PORT: '5432'
      LEDGER_DB_NAME: ledger_ci
      LEDGER_DB_USER: ledger_ci
      LEDGER_DB_PASSWORD: CI-only-db-password-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python and PostgreSQL client tools
        run: |
          python -m pip install -e ".[dev]"
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Verify local PostgreSQL connection, schema and migrations
        run: |
          python backend/manage.py db_status
          python backend/manage.py check --database default
          python backend/manage.py migrate --noinput
          python backend/manage.py makemigrations --check --dry-run
      - name: Run complete financial API suite against real PostgreSQL
        run: pytest -q
      - name: Create and validate an actual PostgreSQL archive
        run: |
          python backend/manage.py backup_ledger --directory "$RUNNER_TEMP/ledger-backups"
          snapshot=$(find "$RUNNER_TEMP/ledger-backups" -maxdepth 1 -name 'ledger-*.dump' -type f | head -n 1)
          test -n "$snapshot"
          python backend/manage.py restore_ledger "$snapshot"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify JavaScript/JSX-only sources
        run: npm run verify:source
      - name: Lint and production bundle
        run: |
          npm run lint
          npm run build
      - name: Dependency security review
        run: npm audit --audit-level=high
  docker:
    runs-on: ubuntu-latest
    env:
      LEDGER_DB_PASSWORD: CI-only-db-password-123456
    steps:
      - uses: actions/checkout@v4
      - name: Build both local containers
        run: docker compose build
      - name: Prepare isolated local secrets and boot
        run: |
          python -c 'import secrets;from pathlib import Path;Path(".env").write_text("DJANGO_SECRET_KEY="+secrets.token_urlsafe(56)+"\nLEDGER_USERNAME=ledger-ci-owner\nLEDGER_PASSWORD=CI-only-Password-123456789-strong\nDJANGO_DEBUG=0\nDJANGO_ALLOWED_HOSTS=localhost,127.0.0.1\nCOOKIE_SECURE=0\n")'
          docker compose up -d
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Shutdown
        if: always()
        run: docker compose down --remove-orphans
  browser_e2e:
    runs-on: ubuntu-latest
    env:
      LEDGER_DB_PASSWORD: CI-only-db-password-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend and Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start isolated KC Ledger Docker environment
        run: |
          python -c 'import secrets;from pathlib import Path;Path(".env").write_text("DJANGO_SECRET_KEY="+secrets.token_urlsafe(56)+"\nLEDGER_USERNAME=ledger-ci-owner\nLEDGER_PASSWORD=CI-only-Password-123456789-strong\nDJANGO_DEBUG=0\nDJANGO_ALLOWED_HOSTS=localhost,127.0.0.1\nCOOKIE_SECURE=0\n")'
          docker compose up --build -d
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Run browser financial workflow tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kc-ledger-browser-e2e
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
      - name: Stop isolated Docker environment
        if: always()
        run: docker compose down --remove-orphans

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
      - name: Windows desktop and installer build
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          & desktop\build_windows.ps1
      - name: Smoke-test packaged Windows executable
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'dist\KC Ledger\KC Ledger.exe'
          if (!(Test-Path $exe)) { throw 'Packaged KC Ledger executable missing' }
          $report = Join-Path $env:RUNNER_TEMP 'kc-ledger-smoke.json'
          $env:LEDGER_SMOKE_REPORT = $report
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          try {
            if (-not $p.WaitForExit(120000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw 'Packaged Windows executable timed out after 120 seconds'
            }
          } finally {
            if (Test-Path $report) { Get-Content $report }
          }
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "Windows executable self-test failed: $($p.ExitCode)" }
          if (!(Test-Path $report)) { throw 'Windows smoke test did not produce its report' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw 'Desktop runtime smoke assertions failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kc-ledger-windows-smoke
          path: ${{ runner.temp }}/kc-ledger-smoke.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kc-ledger-windows-output
          path: installer-output/*.exe
          if-no-files-found: warn
